<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to jasonholt.dev</title>
  <meta http-equiv="refresh" content="0; url=https://www.jasonholt.dev/">
  <link rel="canonical" href="https://www.jasonholt.dev/">
  <meta name="robots" content="noindex, follow">
  <script>
    window.location.replace('https://www.jasonholt.dev/' + window.location.search + window.location.hash);
  </script>
  <style>
    :root {
      color-scheme: light;
      --paper: #F4F1EA;
      --ink: #17150F;
      --muted: #5C574D;
      --rule: rgba(23, 21, 15, 0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 30rem;
      width: 100%;
      padding: 28px;
      border: 1px solid var(--rule);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    a.primary {
      display: inline-block;
      padding: 10px 16px;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    nav {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
    }
    nav a:hover, a.primary:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <h1>Moved to jasonholt.dev</h1>
    <p>This page now lives at <a href="https://www.jasonholt.dev/" style="color: inherit;">jasonholt.dev</a>. You should be redirected automatically.</p>
    <a class="primary" href="https://www.jasonholt.dev/">Continue to jasonholt.dev</a>
    <nav aria-label="BinaryLoom legal pages">
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </main>
</body>
</html>
